[package]
name = "factory"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
# The shared types (`PlatformConfig`, `MarketParams`) and the config validation live in the
# `shared` crate, the same one the Auction uses.
#
# You **cannot** depend on the `auction` crate: its `#[contractimpl]` exports `__constructor`
# with `#[export_name]`, and a crate imported that way drags the exports into the importer's WASM
# - the link dies with `symbol multiply defined`. The `shared` `lib.rs` has the details.
shared = { path = "../shared" }
soroban-sdk = "26.0.1"

[dev-dependencies]
soroban-sdk = { version = "26.0.1", features = ["testutils"] }
